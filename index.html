<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EE">
<title>Mum in Paris</title>
<meta name="google-site-verification" content="4izQusmX2AHgCNZkplTpkPm9FxL3qSGvLSDtD7OWuGQ" />
<meta name="description" content="Les sorties en famille à Paris recommandées par @mum_inparis.">
<meta property="og:title" content="Mum in Paris">
<meta property="og:description" content="Parce que Paris, c’est à visiter en famille !">
<meta property="og:image" content="https://muminparis.github.io/Mum-in-Paris-Tips/icon-512.png">
<meta property="og:url" content="https://muminparis.github.io/Mum-in-Paris-Tips/">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Mum in Paris">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EE; --surface:#FFFFFF; --ink:#141414; --ink-soft:#5C5A55; --line:#DDD6CB;
  --pink:#C8102E; --pink-soft:#F6E3E5; --pink-ink:#A50D26;
  --sky:#ECE7DF; --butter:#ECE7DF; --mint:#ECE7DF; --mint-ink:#141414;
  --sky-ink:#141414; --butter-ink:#141414;
  --script:"Fraunces", Georgia, serif;
  --serif:"Fraunces", Georgia, "Times New Roman", serif;
  --sans:"Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--pink);outline-offset:3px;border-radius:6px}

.app{max-width:480px;margin:0 auto;padding-bottom:96px;min-height:100%}

/* Header */
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px 0}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border:0;background:transparent;border-radius:50%;cursor:pointer;color:var(--ink)}
.icon-btn svg{width:24px;height:24px}

/* Hero */
.hero{position:relative;text-align:center;padding:0 0 4px}
.medal{width:178px;height:178px;margin:-30px auto 0;display:block;position:relative;z-index:2}
.medal .ring{transform-origin:110px 110px;animation:settle 1.4s cubic-bezier(.2,.7,.2,1) both}
.medal .heart{transform-box:fill-box;transform-origin:center;animation:beat 1.2s .9s ease-in-out both}
@keyframes settle{from{transform:rotate(-40deg);opacity:0}to{transform:rotate(0);opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(.95)}}
@media (prefers-reduced-motion:reduce){.medal .ring,.medal .heart{animation:none}}
.skyline{display:block;width:100%;height:auto;margin-top:-62px;position:relative;z-index:1}

/* Search */
.search{margin:-9px 18px 0;position:relative;z-index:3}
.search label{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 18px;box-shadow:0 6px 18px -10px rgba(30,42,90,.35)}
.search svg{width:22px;height:22px;flex:none;color:var(--ink)}
.search input{border:0;outline:0;background:transparent;font:inherit;color:var(--ink);width:100%;font-size:16px}
.search input::placeholder{color:var(--ink-soft)}

/* Sections */
section{margin-top:30px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 18px;margin-bottom:12px}
h2{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.1;margin:0;letter-spacing:.2px}
.see-all{font-size:14px;font-weight:600;color:var(--pink-ink);text-decoration:none;background:none;border:0;cursor:pointer;padding:4px 0}

/* Now cards */
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px 18px 10px;scroll-snap-type:x mandatory;scroll-padding-left:18px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-dots{display:flex;justify-content:center;gap:6px;margin:2px 0 6px}
.rail-dots i{width:6px;height:6px;border-radius:50%;background:#D9D3C8;transition:background .2s,width .2s}
.rail-dots i.on{background:var(--ink);width:16px;border-radius:3px}
.card{flex:0 0 72%;max-width:250px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;cursor:pointer;padding:0;position:relative}
.card .pic{height:140px;position:relative}
.card .pic svg{width:100%;height:100%;display:block}
.badge{position:absolute;left:10px;bottom:10px;font-size:11px;font-weight:700;letter-spacing:.3px;padding:4px 10px;border-radius:999px}
.b-coeur{background:var(--pink);color:#fff}
.b-gratuit{background:var(--mint);color:var(--mint-ink)}
.b-plan{background:var(--butter);color:var(--butter-ink)}
.fav{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;color:#C8102E}
.fav svg{width:19px;height:19px}
.fav[aria-pressed="true"] path{fill:#C8102E}
.card .body{padding:12px 14px 14px}
.card h3{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.15;margin:0 0 8px}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-soft)}
.facts span{display:inline-flex;align-items:center;gap:5px}
.facts svg{width:15px;height:15px;flex:none}

/* Quick filters */
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 8px}
.q{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:6px 2px;font-size:13px;font-weight:600;text-align:center;line-height:1.2}
.q .disc{width:54px;height:54px;border-radius:50%;display:grid;place-items:center}
.q .disc svg{width:28px;height:28px}
.q-pink .disc{background:var(--pink-soft);color:var(--pink-ink)}
.q-sky .disc{background:var(--sky);color:var(--sky-ink)}
.q-butter .disc{background:var(--butter);color:var(--butter-ink)}
.q-mint .disc{background:var(--mint);color:var(--mint-ink)}

/* Coups de coeur list */
.picks{display:flex;flex-direction:column;gap:12px;padding:0 18px}
.pick{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 10px;text-align:left;cursor:pointer;width:100%}
.pick .thumb{width:72px;height:72px;border-radius:12px;flex:none;overflow:hidden}
.pick .thumb svg{width:100%;height:100%;display:block}
.pick h3{font-size:16px;font-weight:700;margin:0 0 2px;line-height:1.3}
.pick p{margin:0;font-size:13px;color:var(--ink-soft)}
.pick .chev{width:20px;height:20px;margin-left:auto;flex:none;color:var(--ink-soft)}
h2 .h{color:var(--pink);display:inline-block;width:22px;height:22px;vertical-align:-2px;margin-right:6px}

/* Instagram note */
.note{margin:34px 18px 0;padding:22px 20px;border-radius:20px;background:var(--surface);border:1px dashed var(--pink);text-align:center}
.note .sig{font-family:var(--script);font-size:30px;line-height:1;margin:0 0 8px}
.note p{margin:0 0 14px;font-family:var(--serif);font-size:19px;line-height:1.45;font-style:italic;color:var(--ink-soft);max-width:34ch;margin-inline:auto}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer}
.btn svg{width:18px;height:18px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.nav ul{max-width:480px;margin:0 auto;padding:6px 6px 8px;list-style:none;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{width:100%;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-soft);padding:6px 0;cursor:pointer}
.nav svg{width:24px;height:24px}
.nav [aria-current="page"]{color:var(--pink)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* Fiche sortie */
.detail{display:none}
body.on-detail #home,body.on-detail .nav{display:none}
body.on-detail .detail{display:block}
.d-hero{position:relative;height:310px;overflow:hidden}
.d-hero > svg{width:100%;height:100%;display:block}
.d-top{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px}
.d-top div{display:flex;gap:10px}
.round{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.round svg{width:21px;height:21px}
.d-top .fav{position:static;width:42px;height:42px}
.d-body{position:relative;background:var(--bg);border-radius:26px 26px 0 0;margin-top:-26px;padding:22px 20px 150px}
.tags{display:flex;gap:8px;margin-bottom:12px}
.tags .badge{position:static}
.b-type{background:var(--pink-soft);color:var(--pink-ink)}
.d-body h1{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.05;margin:0 0 8px}
.loc{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:15px;margin:0}
.loc svg{width:17px;height:17px}
.d-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin:20px 0 26px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
.d-facts span{display:flex;align-items:center;gap:8px}
.d-facts svg{width:20px;height:20px;flex:none;color:var(--pink)}
.d-body h2{font-size:25px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.d-body h2 svg{width:20px;height:20px;color:var(--pink)}
.why{margin:0 0 22px;font-size:16px;line-height:1.7;max-width:62ch}
.why.empty{color:var(--ink-soft);font-style:italic}
.tip{display:flex;gap:12px;background:var(--butter);border-radius:16px;padding:14px 16px;color:var(--ink)}
.tip svg{width:24px;height:24px;flex:none;color:var(--butter-ink)}
.tip strong{display:block;font-size:15px;margin-bottom:2px}
.tip p{margin:0;font-size:14px;line-height:1.55}
.d-bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 20px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.d-bar-in{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.d-bar .btn{width:100%;justify-content:center;font-size:16px;padding:15px 22px}
.link-btn{background:none;border:0;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;padding:6px}
.link-btn svg{width:17px;height:17px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
body[data-view="detail"] .nav,body[data-view="form"] .nav{display:none}
body:not([data-view="home"]) #home{display:none}
body[data-view="home"] #view{display:none}
.thumb img,.pic img,.d-hero img{width:100%;height:100%;object-fit:cover;display:block}
.v-head{display:flex;align-items:center;gap:6px;padding:10px 12px 4px}
.v-head h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;margin:0}
.v-sub{padding:0 18px;margin:4px 0 16px;color:var(--ink-soft);font-size:15px}
.list{display:flex;flex-direction:column;gap:12px;padding:0 18px}
.row-card{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 8px;text-align:left;width:100%;cursor:pointer}
.row-card .thumb{width:84px;height:84px;border-radius:10px;overflow:hidden;flex:none;position:relative}
.row-card .thumb svg{width:100%;height:100%;display:block}
.row-card .rc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-card .badge{position:static;display:inline-block;align-self:flex-start;font-size:10px;padding:2px 8px;margin-bottom:2px}
.row-card h3{font-family:var(--sans);font-weight:700;font-size:15px;line-height:1.25;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-card .ln{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-card .ln svg{width:14px;height:14px;flex:none}
.row-card .chev{margin-left:auto;width:18px;height:18px}
.list{gap:10px}
.empty-box{margin:8px 18px;padding:22px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--ink-soft)}
.empty-box p{margin:0 0 12px}
.lock{padding:40px 24px;text-align:center;color:var(--ink-soft)}
.lock .sig{font-family:var(--script);font-size:30px;color:var(--ink);margin:0 0 6px}
.btn[disabled]{opacity:.6;cursor:wait}

.pic,.thumb,.d-hero{position:relative}
.pic img,.thumb img,.d-hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gal{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gal::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;height:100%;position:relative;scroll-snap-align:start}
.slide svg{width:100%;height:100%;display:block}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dots{position:absolute;left:0;right:0;bottom:40px;display:flex;justify-content:center;gap:7px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 3px rgba(0,0,0,.3)}
.dots i.on{background:#fff}
.f-head{display:flex;align-items:center;gap:6px;padding:10px 12px 0}
.f-head h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;margin:0}
.f-q{margin:12px 18px 6px}
.f-q label{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:11px 16px}
.f-q svg{width:20px;height:20px;flex:none}
.f-q input{border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);width:100%}
.f-sec{padding:16px 18px;border-bottom:1px solid var(--line)}
.f-sec h2{font-family:var(--sans);font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.f-sec h2 svg{width:22px;height:22px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-ink)}
.f-actions{padding:20px 18px 0;display:flex;flex-direction:column;gap:10px;align-items:center}
.f-actions .btn{width:100%;justify-content:center;font-size:16px;padding:15px 22px}
.btn.soft{background:var(--pink-soft);color:var(--pink-ink)}
.active-filters{padding:0 18px 12px;display:flex;flex-wrap:wrap;gap:6px}
.active-filters .chip{padding:6px 12px;font-size:13px}
.about{padding:8px 22px 30px}
.about .sig{font-family:var(--script);font-size:40px;line-height:1;margin:6px 0 16px;color:var(--ink)}
.about p{font-family:var(--serif);font-size:20px;line-height:1.55;margin:0 0 16px;max-width:36ch}
.about .btn{margin-top:8px}
.about .made{margin-top:28px;font-size:13px;color:var(--ink-soft)}
.map-cta{padding:22px 18px 0}
.map-cta .btn{width:100%;justify-content:center}
.map-wrap{position:relative;margin:8px 12px 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);height:calc(100vh - 230px);height:calc(100dvh - 230px);min-height:340px;background:#EEE8E2}
#map{position:absolute;inset:0}
.fav-map{height:calc(100vh - 290px);height:calc(100dvh - 290px)}
.chip svg{width:15px;height:15px;vertical-align:-3px;margin-right:5px}
.map-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink-soft);font-size:15px}
.pin{width:34px;height:34px;display:grid;place-items:center;filter:drop-shadow(0 2px 3px rgba(30,42,90,.35))}
.pin svg{width:34px;height:34px}
.leaflet-popup-content-wrapper{border-radius:14px!important;font-family:var(--sans)!important}
.leaflet-popup-content{margin:12px 14px!important}
.pop h3{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 4px;line-height:1.15;color:#141414}
.pop p{margin:0 0 8px!important;font-size:13px;color:#5A6386}
.pop a{font-weight:700;color:#A50D26!important;text-decoration:none}
.map-note{padding:8px 18px 0;font-size:13px;color:var(--ink-soft)}
.d-map{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;font-weight:700;color:var(--pink-ink);text-decoration:none}
.d-map svg{width:16px;height:16px}
.sortbar{display:flex;gap:8px;overflow-x:auto;padding:0 18px 14px;scrollbar-width:none}
.sortbar::-webkit-scrollbar{display:none}
.sortbar .chip{flex:none;padding:7px 13px;font-size:13px}
.b-avoir{background:var(--sky);color:var(--sky-ink)}
.avoir-note{background:var(--sky);color:var(--ink);border-radius:16px;padding:14px 16px;margin:0 0 22px}
.avoir-note strong{display:block;font-size:15px;margin-bottom:2px}
.avoir-note p{margin:0;font-size:14px;line-height:1.55}
.star-p{margin-left:-6px}
.partner-note{margin:0;font-size:12px;line-height:1.45;color:var(--ink-soft);text-align:center;max-width:44ch}
.leaflet-tile-pane{filter:saturate(.55) sepia(.12) brightness(1.03)}
/* Rive gauche */
h2{font-weight:500;letter-spacing:-.5px}
.v-head h1,.f-head h1,.d-body h1{font-weight:500;letter-spacing:-.6px}
.sec-head{border-bottom:1px solid var(--ink);padding-bottom:8px;margin:0 18px 14px;padding-left:0;padding-right:0}
.see-all{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.card,.pick,.row-card,.admin-row{border-radius:8px}
.card .pic,.pick .thumb,.row-card .thumb{border-radius:4px}
.card{border-color:var(--line)}
.card h3,.d-body h1{font-weight:500}
.search label{border-radius:6px;border-color:var(--ink);box-shadow:none}
.q .disc{background:transparent!important;border:1px solid var(--ink);color:var(--ink)!important}
.q-pink .disc{border-color:var(--pink)!important;color:var(--pink)!important}
.q{font-weight:500}
.btn{background:var(--ink);border-radius:6px;font-weight:600;letter-spacing:.2px}
.btn.soft{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.map-cta .btn{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.chip{border-color:var(--ink);background:transparent;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.b-coeur{background:var(--pink);color:#fff}
.b-gratuit{background:var(--ink);color:#fff}
.b-plan{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.b-avoir{background:transparent;color:var(--pink);border:1px solid var(--pink)}
.b-type{background:var(--sky);color:var(--ink)}
.badge{border-radius:3px;letter-spacing:.4px;font-weight:600}
.tip,.avoir-note{border-radius:6px;background:var(--sky)}
.note{border:1px solid var(--ink);border-radius:8px}
.note .sig,.about .sig{font-style:italic;font-weight:400;letter-spacing:-.5px}
.note p,.about p{font-style:normal}
.nav{border-top:1px solid var(--ink)}
.nav [aria-current="page"]{color:var(--pink)}
.fav{border-radius:50%}
.d-facts{border-color:var(--ink)}
.d-facts svg,.d-body h2 svg,h2 .h{color:var(--pink)}
.leaflet-tile-pane{filter:grayscale(.85) sepia(.15) brightness(1.04)}
.b-pause{background:#E3DED5;color:#5C5A55}
.row-card.paused .thumb{filter:grayscale(1);opacity:.7}
.row-card.paused h3{color:var(--ink-soft)}
.pin{position:relative}
.pin-heart{position:absolute;top:-4px;right:-3px;width:15px;height:15px;border-radius:50%;background:#fff;color:#C8102E;font-size:11px;line-height:15px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;padding:10px 14px 0}
.leg{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px 5px 6px;font-size:12.5px;font-weight:500;cursor:pointer;color:var(--ink)}
.leg svg{width:18px;height:18px}
.leg[aria-pressed="false"]{opacity:.4;text-decoration:line-through}
.bday-note{background:#F6E3E5}
.b-last{background:#C8102E;color:#fff}
.q{font-size:12px;padding:6px 0}
.q .disc svg{width:25px;height:25px}
.q-last .disc{border-color:var(--pink)!important;color:var(--pink)!important;background:var(--pink-soft)!important}
:root{--temp:#B8862B;--temp-bg:#F5ECDC}
.q-temp .disc{border-color:var(--temp)!important;color:var(--temp)!important;background:var(--temp-bg)!important}
.row-card .ln-end{color:var(--pink-ink);font-weight:600}
.d-hero.no-photo{height:210px}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px}
.bike-ride{animation:ride 16s linear infinite}
.bike-ride .wheel{transform-box:fill-box;transform-origin:center;animation:spin .55s linear infinite}
@keyframes ride{from{transform:translateX(-50px)}to{transform:translateX(430px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.bike-ride{animation:none;transform:translateX(190px)}.bike-ride .wheel{animation:none}}

.rc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:2px}
.rc-tags .badge{margin-bottom:0}
.eph{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
.eph svg{width:11px;height:11px}
.eph-a{border:1px solid var(--ink);color:var(--ink);border-radius:3px;padding:1px 7px;align-self:flex-start}
.eph-c{position:absolute;top:6px;left:6px;background:rgba(246,243,238,.94);color:var(--ink);border-radius:3px;padding:2px 6px;font-size:9px;letter-spacing:.5px;z-index:2}
.row-card .thumb .eph-c{left:4px;top:4px;font-size:7px;letter-spacing:.3px;padding:1.5px 4px;font-weight:600;line-height:1.2}
.card .pic .eph-c{top:10px;left:10px;font-size:8.5px;padding:2px 6px}
.row-card .ln-eph{color:var(--pink-ink);font-weight:600}
.row-card .ln-eph svg{color:var(--pink)}
.b-bientot{background:#2F5D50;color:#fff}
.b-eph{background:transparent;border:1px solid var(--ink);color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.b-eph svg{width:12px;height:12px}

.vac-home{margin:6px 0 22px}
.vac-box{margin:0 18px;background:#F5ECDC;border-radius:16px;padding:14px 16px 10px}
.vac-intro{display:flex;align-items:center;gap:12px;margin:0 0 4px;font-size:13.5px;color:var(--ink-soft);line-height:1.35}
.vac-intro svg{width:44px;height:44px;border-radius:10px;flex:none}
.vac-box .vac-list{padding:0}
.vac-box .vac-item{border-bottom:1px solid rgba(20,20,20,.12);padding:11px 0}
.vac-box .vac-item:last-child{border-bottom:0}
.vac-box .vac-link{background:var(--surface)}
.vac-all{width:100%;margin:6px 0 6px}
.vac-cat{font-family:var(--serif);font-weight:500;font-size:22px;margin:22px 18px 8px}
.vac-list{list-style:none;margin:0;padding:0 18px;display:flex;flex-direction:column}
.vac-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.vac-txt{flex:1;min-width:0}
.vac-txt h3{font-size:16px;font-weight:700;margin:0 0 3px}
.vac-txt p{margin:0 0 4px;font-size:14px;color:var(--ink);line-height:1.4}
.vac-meta{font-size:12.5px;color:var(--ink-soft)}
.vac-link{flex:none;border:1px solid var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
.vac-note{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:16px 18px 0}
.q-vac .disc{border-color:#2C6E8F!important;color:#2C6E8F!important;background:#E3EEF3!important}
.quick.quick-6{display:flex;overflow-x:auto;gap:2px;padding:0 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.quick.quick-6::-webkit-scrollbar{display:none}
.quick.quick-6 .q{flex:0 0 19%;scroll-snap-align:start}

.quick{display:flex!important;justify-content:space-around}
.quick .q{flex:1 1 0;min-width:0}
/* Frise « En ce moment » compacte */
.rail.compact .card{flex:0 0 56%;max-width:205px;border-radius:14px}
.rail.compact .card .pic{height:100px}
.rail.compact .card .body{padding:9px 11px 11px}
.rail.compact .card h3{font-size:16.5px;margin:0 0 6px}
.rail.compact .facts{font-size:12px;gap:4px 10px}
.rail.compact .facts svg{width:13px;height:13px}
.rail.compact .badge{font-size:10px;padding:3px 8px;left:8px;bottom:8px}
.rail.compact .fav{transform:scale(.85);transform-origin:top right}
.rail.compact .eph-c{top:7px!important;left:7px!important;font-size:8px!important;padding:2px 5px!important}
.coffee{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);text-align:center}
.coffee p{font-family:var(--sans,inherit);font-size:14px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5}
.insta-wrap{display:flex;justify-content:flex-end;margin:12px 0 4px}
.insta-link{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:999px;background:var(--pink-soft);color:var(--pink);text-decoration:none;font-size:12.5px;font-weight:600;line-height:1}
.insta-link svg{width:16px;height:16px;flex:none}

function railIndex(rail) {
  const cards = [...rail.querySelectorAll('.card')];
  let best = 0, d = Infinity;

function distKm(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;

  return 2 * R * Math.asin(Math.sqrt(h));
}

function sortList0(list) {

  // Pendant les vacances : seule la bulle « Vacances scolaires » apparaît sur l'accueil
  const qb = document.querySelector('.q-vac'), qw = document.getElementById('quick');
  if (qb) qb.hidden = !VAC.length;
}
function renderVacances() {
  const cats = [...new Set(VAC.map(v => v.cat || ''))];
  const item = v => `<li class="vac-item">
      <div class="vac-txt"><h3>${esc(v.t)}</h3>${v.what ? `<p>${esc(v.what)}</p>` : ''}
        ${v.age || v.where ? `<span class="vac-meta">${esc([v.age, v.where].filter(Boolean).join(' · '))}</span>` : ''}</div>
      ${v.url ? `<a class="vac-link" href="${esc(v.url)}" target="_blank" rel="noopener">Voir ↗</a>` : ''}
    </li>`;
  const groups = cats.map(c => {
    const list = VAC.filter(v => (v.cat || '') === c);
    return `${c && cats.length > 1 ? `<h2 class="vac-cat">${esc(c)}</h2>` : ''}<ul class="vac-list">${list.map(item).join('')}</ul>`;
  }).join('');
  return `<div class="v-head"><button class="icon-btn" data-back aria-label="Retour">${ICON.back}</button><h1>${esc(vacTitle())}</h1></div>
  ${VAC.length ? `<p class="v-sub">Les lieux qui ont une programmation spéciale pendant les vacances : activités et animations pour toute la famille. Touchez « Voir » pour le programme et les réservations.</p>
  ${groups}
  `
  : '<div class="empty-box" style="margin-top:12px"><p>Le programme des vacances arrive très bientôt.</p></div>'}`;
}
async function loadAbout() {
  if (!SHEET_CSV_URL) return;
  try {
    const url = SHEET_CSV_URL.replace(/([?&])sheet=[^&]*/, '$1sheet=' + encodeURIComponent('À propos')).replace(/([?&])headers=1/, '$1headers=0');
    const res = await fetch(url + '&t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    const paras = parseCSV(text).map(r => clean(r[0])).filter(Boolean);
    // Si l'onglet n'existe pas, Google renvoie le premier onglet : on l'ignore.
    if (paras.length && norm(paras[0]) !== 'nom') {
      const c = paras.find(isCoffee);
      if (c) COFFEE_URL = fixUrl((c.match(/(https?:\/\/)?\S*(ko-fi\.com|buymeacoffee\.com|tipeee\.com|paypal\.me|lydia)\S*/i) || [''])[0]);
      const text = paras.filter(t => !isCoffee(t));
      if (text.length) ABOUT = text;
      if (location.hash === '#a-propos') route();
    }
  } catch (e) {}
}

/* ---------- Navigation ---------- */
function show(name, html) {
  document.body.dataset.view = name;
  if (html != null) document.getElementById('view').innerHTML = html;
  const cur = name === 'home' ? 'home' : (name === 'filters' || name === 'results') ? 'search' : name === 'favs' ? 'favs' : name === 'idea' ? 'idea' : name === 'coeur' ? 'coeur' : '';
  document.querySelectorAll('.nav [data-tab]').forEach(b => b.dataset.tab === cur ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
}
let lastHash = null;
const navStack = [], scrollMem = {};
function route() {
  const h = location.hash.slice(1), changed = h !== lastHash;
  let goingBack = false;
  if (changed) {
    if (lastHash !== null) scrollMem[lastHash] = window.scrollY;
    if (navStack.length > 1 && navStack[navStack.length - 2] === h) { navStack.pop(); goingBack = true; }
    else navStack.push(h);
  }
  lastHash = h;
  let m, s;
  document.title = 'Mum in Paris';
  if ((m = h.match(/^sortie\/(.+)$/)) && (s = find(decodeURIComponent(m[1])))) {
    show('detail', renderDetail(s)); document.title = s.t + ' · Mum in Paris';
    const gal = document.getElementById('gal');
    if (gal) gal.addEventListener('scroll', () => {
      const n = Math.round(gal.scrollLeft / gal.clientWidth);
      gal.parentNode.querySelectorAll('.dots i').forEach((d, i) => d.classList.toggle('on', i === n));
    }, { passive: true });
  }
  else if (h === 'toutes') show('all', renderAll());
  else if (h === 'rechercher') show('filters', renderFilters());
  else if (h === 'favoris') { show('favs', renderFavs()); if (FAV_VIEW === 'map' && document.getElementById('map')) drawMap(null, favs); }
  else if (h === 'idee') show('idea', renderIdea());
  else if (h === 'coups-de-coeur') show('coeur', renderCoeur());
  else if (h === 'carte' || (m = h.match(/^carte\/(.+)$/))) { const fid = m && m[1] ? decodeURIComponent(m[1]) : null; show('map', renderMap(fid)); drawMap(fid); }
  else if (h === 'a-propos') show('about', renderAbout());
  else if (h === 'vacances') show('vacances', renderVacances());
  else if (h === 'resultats') show('results', renderResults());
  else { renderHome(); show('home'); }
  if (changed) { const y = goingBack ? (scrollMem[h] || 0) : 0; window.scrollTo(0, y); if (goingBack && y) setTimeout(() => window.scrollTo(0, y), 60); }
  track();
}
window.addEventListener('hashchange', route);

/* ---------- Statistiques de visite (GoatCounter, sans cookies) ---------- */
let lastTracked = null;
function track() {
  const h = location.hash.slice(1);
  const path = '/' + decodeURIComponent(h || '');
  if (path === lastTracked) return;
  const send = (tries) => {
    if (window.goatcounter && window.goatcounter.count) {
      lastTracked = path;
      try { window.goatcounter.count({ path, title: document.title }); } catch (e) {}
    } else if (tries > 0) setTimeout(() => send(tries - 1), 500);
  };
  send(20);
}

async function share() {
  const m = location.hash.match(/^#sortie\/(.+)$/);
  const s = m && find(decodeURIComponent(m[1]));
  const data = { title: s ? s.t + ' · Mum in Paris' : 'Mum in Paris', text: s ? 'Une sortie recommandée par @mum_inparis' : 'Les sorties en famille à Paris de @mum_inparis 🤍', url: s ? location.href : location.origin + location.pathname };
  try { if (navigator.share) { await navigator.share(data); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(data.url); toast('Lien copié'); }
  catch (e) { toast('Copiez le lien depuis la barre d’adresse'); }
}

const toastEl = document.getElementById('toast');
let tt;
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('on'), 2400); }

document.addEventListener('click', e => {
  const fav = e.target.closest('.fav');
  if (fav) {
    e.stopPropagation();
    const id = fav.dataset.id, on = !favs.includes(id);
    favs = on ? [...favs, id] : favs.filter(x => x !== id);
    fav.setAttribute('aria-pressed', on); saveFavs();
    toast(on ? 'Ajouté à vos favoris' : 'Retiré de vos favoris');
    if (document.body.dataset.view === 'favs') route();
    return;
  }
  if (e.target.closest('[data-back]')) { if (navStack.length > 1) history.back(); else location.hash = ''; return; }
  const go = e.target.closest('[data-go]');
  if (go) {
    const target = go.dataset.go.replace(/^#/, '');
    // Si la destination est la page précédente, on recule dans l'historique au lieu d'empiler une nouvelle page
    if (navStack.length > 1 && navStack[navStack.length - 2] === target) history.back();
    else location.hash = go.dataset.go;
    return;
  }
  const fv = e.target.closest('[data-favview]');
  if (fv) { FAV_VIEW = fv.dataset.favview; route(); return; }
  if (e.target.closest('[data-share]')) { share(); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { location.hash = ({ search: 'rechercher', favs: 'favoris', idea: 'idee', coeur: 'coups-de-coeur' })[tab.dataset.tab] || ''; return; }
  const pc = e.target.closest('[data-pincat]');
  if (pc) { const k = pc.dataset.pincat; mapHidden.has(k) ? mapHidden.delete(k) : mapHidden.add(k); applyMapFilter(); return; }
  const so = e.target.closest('[data-sort]');
  if (so) {
    SORT = so.dataset.sort;
    if (SORT === 'distance' && !USERPOS) { askPosition(); return; }
    const y = window.scrollY; route(); window.scrollTo(0, y); return;
  }
  const chip = e.target.closest('[data-f]');
  if (chip) {
    const k = chip.dataset.f, v = chip.dataset.v, on = !F[k].includes(v);
    F[k] = on ? [...F[k], v] : F[k].filter(x => x !== v);
    chip.setAttribute('aria-pressed', on); refreshCount(); return;
  }
  const rm = e.target.closest('[data-rm]');
  if (rm) {
    const k = rm.dataset.rm;
    if (k === 'q') F.q = ''; else if (k === 'rain') F.rain = false; else if (k === 'soon') F.soon = false; else F[k] = F[k].filter(x => x !== rm.dataset.v);
    route(); return;
  }
  if (e.target.closest('[data-clear]')) { resetF(); route(); return; }
  if (e.target.closest('[data-random]')) {
    const pool = results().length ? results() : SORTIES;
    if (!pool.length) { toast('Aucune sortie pour le moment'); return; }
    const s = pool[Math.floor(Math.random() * pool.length)];
    location.hash = 'sortie/' + encodeURIComponent(s.id); return;
  }
  const qk = e.target.closest('[data-quick]');
  if (qk) { quick(qk.dataset.quick); return; }
  const op = e.target.closest('[data-open]');
  if (op) { location.hash = 'sortie/' + encodeURIComponent(op.dataset.open); return; }
  const soon = e.target.closest('[data-soon]');
  if (soon) { const t = soon.dataset.soon; toast('Bientôt : ' + t.charAt(0).toLowerCase() + t.slice(1)); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.card')) e.target.click(); });

/* ---------- Chargement des sorties ---------- */
async function load() {
  if (!SHEET_CSV_URL) { SORTIES = build(DEMO); STATE = 'ok'; route(); return; }
  try {
    const cached = JSON.parse(localStorage.getItem('mip-cache') || 'null');
    if (cached && cached.length) { SORTIES = build(cached); STATE = 'ok'; }
  } catch (e) {}
  route();
  try {
    const sep = SHEET_CSV_URL.includes('?') ? '&' : '?';
    const res = await fetch(SHEET_CSV_URL + sep + 't=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const objs = rowsToObjects(parseCSV(await res.text()));
    SORTIES = build(objs); STATE = 'ok';
    try { localStorage.setItem('mip-cache', JSON.stringify(objs)); } catch (e) {}
  } catch (e) {
    if (!SORTIES.length) STATE = 'error';
  }
  route();
}
load();
loadAbout();
loadVacances();

</script>
